services:
  web-search:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-search
    networks: [search_internal, search_egress]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
  redis:
    profiles: [backend]
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    user: redis
    networks: [agent_internal]
    read_only: true
    tmpfs: ["/data:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    profiles: [backend]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DAMIR_BACKEND_URL: http://0.0.0.0:8080
      DAMIR_BACKEND_API_KEY: ${DAMIR_BACKEND_API_KEY:-}
      DAMIR_GITHUB_MCP: ${DAMIR_GITHUB_MCP:-0}
      DAMIR_BACKEND_WORKERS: ${DAMIR_BACKEND_WORKERS:-2}
      DAMIR_TASK_TIMEOUT_SECONDS: ${DAMIR_TASK_TIMEOUT_SECONDS:-300}
      DAMIR_OBSERVABILITY_ENABLED: ${DAMIR_OBSERVABILITY_ENABLED:-0}
      DAMIR_OTEL_ENDPOINT: ${DAMIR_OTEL_ENDPOINT:-}
      DAMIR_TRACE_SAMPLE_RATIO: ${DAMIR_TRACE_SAMPLE_RATIO:-1}
      DAMIR_LANGFUSE_ENDPOINT: ${DAMIR_LANGFUSE_ENDPOINT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      REDIS_URL: redis:6379
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-6.1-sol}
      DAMIR_TIMEZONE: ${DAMIR_TIMEZONE:-UTC}
      DAMIR_CONTEXT_TOKENS: ${DAMIR_CONTEXT_TOKENS:-}
      DAMIR_POSTGRES_PASSWORD: ${DAMIR_POSTGRES_PASSWORD:?Use ./damir to set a database password}
      DAMIR_MEMORY_ENABLED: ${DAMIR_MEMORY_ENABLED:-1}
      DAMIR_MEMORY_OWNER: ${DAMIR_MEMORY_OWNER:-local}
      DAMIR_MEMORY_PROJECT: ${DAMIR_MEMORY_PROJECT:-}
      DAMIR_WORKSPACE_LABEL: ${DAMIR_WORKSPACE_LABEL:-текущий проект}
      DAMIR_EMBEDDING_DEPLOYMENT: ${DAMIR_EMBEDDING_DEPLOYMENT:-damir-memory-embedding}
      DAMIR_EMBEDDING_MODEL: ${DAMIR_EMBEDDING_MODEL:-ollama/embeddinggemma:300m}
      DAMIR_EMBEDDING_DIMENSIONS: ${DAMIR_EMBEDDING_DIMENSIONS:-768}
    ports:
      - "127.0.0.1:${DAMIR_BACKEND_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${DAMIR_WORKSPACE:-./workspace}
        target: /workspace
      - sandbox_ipc:/sandbox-ipc
      - github_mcp_ipc:/github-ipc
    working_dir: /workspace
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 40s
    networks: [agent_internal, backend_http, search_internal]
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [agent_internal]
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  cli:
    profiles: [backend]
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    environment:
      DAMIR_BACKEND_URL: ${DAMIR_CLI_BACKEND_URL:-http://backend:8080}
      DAMIR_BACKEND_API_KEY: ${DAMIR_BACKEND_API_KEY:-}
      DAMIR_SESSION_ID: ${DAMIR_SESSION_ID:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DAMIR_TELEGRAM_AUTO_OPEN: ${DAMIR_TELEGRAM_AUTO_OPEN:-0}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    stdin_open: true
    tty: true
    networks: [agent_internal, telegram_egress]
  telegram:
    profiles: [telegram]
    build:
      context: .
      dockerfile: docker/Dockerfile.telegram
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      DAMIR_MEMORY_OWNER: ${DAMIR_MEMORY_OWNER:-local}
      DAMIR_MEMORY_PROJECT: ${DAMIR_MEMORY_PROJECT:-}
      DAMIR_SESSION_ID: ${DAMIR_SESSION_ID:-local}
      DAMIR_TELEGRAM_STATE_DIR: /state
      DAMIR_TELEGRAM_BACKENDS_FILE: /profiles/backends.json
    volumes:
      - damir_telegram_state:/state
      - type: bind
        source: ${DAMIR_TELEGRAM_BACKENDS_FILE:-./.uv-cache/telegram-backends-unconfigured.json}
        target: /profiles/backends.json
        read_only: true
        bind:
          create_host_path: false
    networks: [agent_internal, telegram_egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    stop_grace_period: 20s
    stdin_open: true
    tty: true
  telegram-backend:
    extends:
      service: backend
    profiles: [telegram]
    environment:
      DAMIR_BACKEND_API_KEY: ${DAMIR_TELEGRAM_PROFILE_KEY:-}
      DAMIR_MEMORY_OWNER: ${DAMIR_TELEGRAM_PROFILE_OWNER:-}
      DAMIR_MEMORY_PROJECT: ${DAMIR_TELEGRAM_PROFILE_PROJECT:-}
      DAMIR_GITHUB_MCP: "0"
    ports: !reset []
    volumes: !override
      - telegram_workspace:/workspace
      - telegram_ipc:/sandbox-ipc
  telegram-shell:
    extends:
      service: shell-sandbox
    profiles: [telegram]
    volumes: !override
      - telegram_workspace:/workspace
      - telegram_ipc:/ipc
  telegram-legacy:
    extends:
      service: telegram
    profiles: [telegram]
    command: [--drain-legacy]
    environment:
      DAMIR_BACKEND_URL: ${DAMIR_CLI_BACKEND_URL:-http://backend:8080}
      DAMIR_BACKEND_API_KEY: ${DAMIR_BACKEND_API_KEY:-}
    volumes: !override
      - damir_telegram_state:/state
  memory-db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: damir
      POSTGRES_DB: damir_memory
      POSTGRES_PASSWORD: ${DAMIR_POSTGRES_PASSWORD:?Use ./damir to set a database password}
    volumes:
      - damir_memory:/var/lib/postgresql/data
    networks: [agent_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damir -d damir_memory"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 256m
  embeddings:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    volumes:
      - damir_embeddings:/root/.ollama
    networks: [agent_internal, embedding_egress]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0
  github-mcp:
    profiles: [mcp]
    build:
      context: .
      dockerfile: docker/Dockerfile.github-mcp
    environment:
      DAMIR_GITHUB_MCP: "1"
      GITHUB_PERSONAL_ACCESS_TOKEN: ${DAMIR_GITHUB_TOKEN:-}
    volumes:
      - github_mcp_ipc:/ipc
    networks: [github_egress]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
  shell-sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.shell-sandbox
    network_mode: none
    volumes:
      - type: bind
        source: ${DAMIR_WORKSPACE:-./workspace}
        target: /workspace
      - sandbox_ipc:/ipc
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_USER: damir
      POSTGRES_DB: damir
      POSTGRES_PASSWORD: ${DAMIR_POSTGRES_PASSWORD:?Use ./damir to set a database password}
    volumes:
      - damir_postgres:/var/lib/postgresql/data
    networks: [agent_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damir -d damir"]
      interval: 5s
      timeout: 5s
      retries: 24
  gateway:
    image: ghcr.io/berriai/litellm@sha256:679c95daabea3e8775d42c744e6771b8a8cb47b3ea046ab9fb6c9deeb35d3dc3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      CHATGPT_TOKEN_DIR: /tokens/chatgpt
      DAMIR_GATEWAY_CONFIG_REV: ${DAMIR_GATEWAY_CONFIG_REV:-manual}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
      - damir_auth:/tokens/chatgpt
    networks: [agent_internal, gateway_egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    restart: unless-stopped
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    environment:
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-6.1-sol}
      DAMIR_TIMEZONE: ${DAMIR_TIMEZONE:-UTC}
      DAMIR_CONTEXT_TOKENS: ${DAMIR_CONTEXT_TOKENS:-}
      DAMIR_SESSION_ID: ${DAMIR_SESSION_ID:-local}
      DAMIR_POSTGRES_PASSWORD: ${DAMIR_POSTGRES_PASSWORD:?Use ./damir to set a database password}
      DAMIR_GITHUB_MCP: ${DAMIR_GITHUB_MCP:-0}
      DAMIR_MEMORY_ENABLED: ${DAMIR_MEMORY_ENABLED:-1}
      DAMIR_MEMORY_OWNER: ${DAMIR_MEMORY_OWNER:-local}
      DAMIR_MEMORY_PROJECT: ${DAMIR_MEMORY_PROJECT:-}
      DAMIR_EMBEDDING_DEPLOYMENT: ${DAMIR_EMBEDDING_DEPLOYMENT:-damir-memory-embedding}
      DAMIR_EMBEDDING_MODEL: ${DAMIR_EMBEDDING_MODEL:-ollama/embeddinggemma:300m}
      DAMIR_EMBEDDING_DIMENSIONS: ${DAMIR_EMBEDDING_DIMENSIONS:-768}
    volumes:
      - type: bind
        source: ${DAMIR_WORKSPACE:-./workspace}
        target: /workspace
      - sandbox_ipc:/sandbox-ipc
      - github_mcp_ipc:/github-ipc
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
      shell-sandbox:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [agent_internal, search_internal]
networks:
  telegram_egress: {}
  backend_http: {}
  embedding_egress: {}
  agent_internal:
    internal: true
  gateway_egress: {}
  github_egress: {}
  search_internal:
    internal: true
  search_egress: {}
volumes:
  telegram_workspace:
    name: ${DAMIR_TELEGRAM_WORKSPACE_VOLUME:-damir-telegram-unconfigured-workspace}
  telegram_ipc:
    name: ${DAMIR_TELEGRAM_IPC_VOLUME:-damir-telegram-unconfigured-ipc}
  damir_telegram_state: {}
  damir_memory: {}
  damir_embeddings: {}
  damir_auth: {}
  damir_postgres: {}
  sandbox_ipc:
    name: ${DAMIR_SANDBOX_VOLUME:-personal-ai-agent_sandbox_ipc}
  github_mcp_ipc:
    name: ${DAMIR_MCP_VOLUME:-personal-ai-agent_github_mcp_ipc}
